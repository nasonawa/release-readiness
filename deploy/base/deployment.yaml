apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-readiness
  labels:
    app: release-readiness
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: release-readiness
  template:
    metadata:
      labels:
        app: release-readiness
    spec:
      serviceAccountName: release-readiness
      containers:
      - name: dashboard
        image: release-readiness:configured
        imagePullPolicy: Always
        args:
        - -addr=:8080
        - -db=/data/release-readiness.db
        - -jira-write=false
        - -art-build-history-url=$(ART_BUILD_HISTORY_URL)
        - -art-fbc-quay-url=$(ART_FBC_QUAY_URL)
        - -tekton-results-url=$(TEKTON_RESULTS_URL)
        - -catalog-url=$(CATALOG_URL)
        - -gitlab-url=$(GITLAB_URL)
        - -shipment-project=$(SHIPMENT_PROJECT)
        - -ocp-build-data-url=$(OCP_BUILD_DATA_URL)
        - -prow-interval=$(PROW_INTERVAL)
        - -jira-poll-interval=$(JIRA_POLL_INTERVAL)
        - -konflux-poll-interval=$(KONFLUX_POLL_INTERVAL)
        - -gitlab-poll-interval=$(GITLAB_POLL_INTERVAL)
        - -ci-workers=$(CI_WORKERS)
        - -jira-workers=$(JIRA_WORKERS)
        - -art-workers=$(ART_WORKERS)
        - -ci-stream-budget=$(CI_STREAM_BUDGET)
        - -ci-candidate-lookback=$(CI_CANDIDATE_LOOKBACK)
        - -prow-history-interval=$(PROW_HISTORY_INTERVAL)
        - -prow-history-budget=$(PROW_HISTORY_BUDGET)
        - -prow-live-refresh-interval=$(PROW_LIVE_REFRESH_INTERVAL)
        - -prow-inventory-interval=$(PROW_INVENTORY_INTERVAL)
        - -art-current-budget=$(ART_CURRENT_BUDGET)
        - -art-history-interval=$(ART_HISTORY_INTERVAL)
        - -art-history-budget=$(ART_HISTORY_BUDGET)
        - -retention=$(RETENTION)
        envFrom:
        - configMapRef:
            name: release-readiness-config
        - secretRef:
            name: release-readiness-credentials
        env:
        - name: KUBECONFIG
          value: /etc/konflux/kubeconfig
        - name: SSL_CERT_FILE
          value: /etc/pki/ca-trust-injected/ca-bundle.crt
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: data
          mountPath: /data
        - name: konflux
          mountPath: /etc/konflux
          readOnly: true
        - name: trusted-ca
          mountPath: /etc/pki/ca-trust-injected
          readOnly: true
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
        startupProbe:
          httpGet:
            path: /api/v1/health
            port: http
          periodSeconds: 5
          failureThreshold: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: release-readiness-data
      - name: konflux
        secret:
          secretName: release-readiness-konflux
      - name: trusted-ca
        configMap:
          name: release-readiness-trusted-ca
      automountServiceAccountToken: false
