apiVersion: v1
kind: ServiceAccount
metadata:
  name: release-readiness
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: release-readiness-data
spec:
  # Use the cluster default storage class (gp3-csi on the reviewed ROSA cluster).
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: release-readiness-trusted-ca
  labels:
    config.openshift.io/inject-trusted-cabundle: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-readiness
  labels:
    app: release-readiness
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: release-readiness
  template:
    metadata:
      labels:
        app: release-readiness
    spec:
      serviceAccountName: release-readiness
      containers:
        - name: dashboard
          image: quay.io/nasonawa/release-readness:v2.0
          imagePullPolicy: Always
          args: ["-addr", ":8080", "-db", "/data/release-readiness.db"]
          envFrom:
            - secretRef:
                name: release-readiness-jira
          env:
            - name: KUBECONFIG
              value: /etc/konflux/kubeconfig
            - name: KONFLUX_NAMESPACE
              value: art-quay-tenant
            - name: VALIDATION_PLAN
              value: /etc/validation/quay-validation-plan.json
            - name: JIRA_WRITE
              value: "false"
            # Include operator, legacy, upgrade and standalone periodics too.
            - name: PROW_JOB_PATTERN
              value: '^periodic-ci-quay-quay(-operator)?-redhat-(?P<major>\d+)\.(?P<minor>\d+)-.+$'
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: release-readiness-github
                  key: token
                  optional: true
            - name: GITLAB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: release-readiness-gitlab
                  key: token
                  optional: true
            - name: SSL_CERT_FILE
              value: /etc/pki/ca-trust-injected/ca-bundle.crt
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: data
              mountPath: /data
            - name: konflux
              mountPath: /etc/konflux
              readOnly: true
            - name: validation
              mountPath: /etc/validation
              readOnly: true
            - name: trusted-ca
              mountPath: /etc/pki/ca-trust-injected
              readOnly: true
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: release-readiness-data
        - name: konflux
          secret:
            secretName: release-readiness-konflux
        - name: validation
          configMap:
            name: release-readiness-validation
        - name: trusted-ca
          configMap:
            name: release-readiness-trusted-ca
---
apiVersion: v1
kind: Service
metadata:
  name: release-readiness
spec:
  selector:
    app: release-readiness
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: release-readiness
spec:
  to:
    kind: Service
    name: release-readiness
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
